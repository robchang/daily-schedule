<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a0e0a}
*{box-sizing:border-box}
.stage{
  position:fixed;inset:0;overflow:hidden;
  background:#1a0e0a;
}
.scene{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  overflow:hidden;
}
.scene img{
  display:block;width:100%;height:100%;
  object-fit:fill;user-select:none;pointer-events:none;
  -webkit-user-drag:none;
}
.scene-wide{
  aspect-ratio:16/9;
  width:max(100vw, calc(100vh * 16 / 9));
  height:max(100vh, calc(100vw * 9 / 16));
}
.scene-tall{
  display:none;
  aspect-ratio:9/16;
  width:max(100vw, calc(100vh * 9 / 16));
  height:max(100vh, calc(100vw * 16 / 9));
  /* Keep fireplace on-screen: on tall phones the cover box is wider than
     the viewport, so pin to the right edge instead of centering. */
  left:auto;right:0;
  transform:translateY(-50%);
}
@media (max-aspect-ratio: 3/4){
  .scene-wide{display:none}
  .scene-tall{display:block}
}
.layer{position:absolute;inset:0;pointer-events:none}
.titles{
  position:absolute;z-index:5;pointer-events:none;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:.12em;
}
/* Wide: dark wall left of the tree star — clear of star and pets */
.scene-wide .titles{
  left:31%;top:1.8%;
  transform:translateX(-50%);
  width:min(52%, 30rem);
}
.scene-tall .titles{
  left:50%;top:2.2%;
  transform:translateX(-50%);
  width:min(90%, 22rem);
}
.greeting{
  margin:0;padding:0 .35em;
  font-family:Georgia,"Times New Roman",Times,serif;
  font-weight:400;font-style:italic;
  font-size:clamp(1.55rem, 5.2vw, 3.55rem);
  letter-spacing:.04em;
  color:#fff6e0;
  text-shadow:
    0 0 12px rgba(255,200,110,.6),
    0 0 32px rgba(255,160,60,.45),
    0 2px 8px rgba(0,0,0,.75),
    0 0 2px rgba(0,0,0,.9);
  white-space:nowrap;
  opacity:0;
  animation:greetIn 1.1s ease-out .25s forwards;
}
.scene-tall .greeting{
  font-size:clamp(1.45rem, 7vw, 2.45rem);
}
.signoff{
  margin:0;padding:0 .3em;
  position:relative;
  font-family:"Segoe Script","Snell Roundhand","Apple Chancery","Bradley Hand",cursive,Georgia,"Times New Roman",serif;
  font-weight:400;font-style:italic;
  font-size:clamp(1.2rem, 3.4vw, 2.35rem);
  letter-spacing:.03em;
  color:#ffe9b0;
  text-shadow:
    0 0 8px rgba(255,200,100,.65),
    0 0 22px rgba(255,180,60,.45),
    0 2px 5px rgba(0,0,0,.75),
    0 0 2px rgba(0,0,0,.9);
  white-space:nowrap;
  filter:drop-shadow(0 0 6px rgba(255,190,80,.35));
}
.scene-tall .signoff{
  font-size:clamp(1.15rem, 5.6vw, 1.85rem);
}
.signoff .ch{
  display:inline-block;
  opacity:0;
  transform:translateY(.45em) scale(.85);
  animation:letterBounce .55s cubic-bezier(.2,.8,.3,1.25) forwards;
  animation-delay:calc(1.55s + var(--i) * .07s);
}
.signoff .sp{display:inline-block;width:.28em}
.sparkle{
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  background:radial-gradient(circle, #fff6c8 0%, #ffd070 40%, transparent 70%);
  opacity:0;
  pointer-events:none;
  animation:spark 1.6s ease-in-out infinite;
}
.sparkle.s1{left:-4%;top:20%;animation-delay:2.6s}
.sparkle.s2{right:-2%;top:10%;animation-delay:2.9s}
.sparkle.s3{left:48%;top:-35%;animation-delay:3.2s}
.sparkle.s4{right:12%;bottom:-30%;animation-delay:3.5s}
@keyframes greetIn{
  0%{opacity:0;transform:translateY(-.25em)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes letterBounce{
  0%{opacity:0;transform:translateY(.45em) scale(.85)}
  60%{opacity:1;transform:translateY(-.08em) scale(1.06)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes spark{
  0%,100%{opacity:0;transform:scale(.4)}
  40%{opacity:.95;transform:scale(1.25)}
  70%{opacity:.35;transform:scale(.8)}
}
.light{
  position:absolute;
  width:1.1%;height:auto;aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,245,200,.95) 0%,rgba(255,200,90,.55) 35%,rgba(255,160,40,0) 70%);
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
  animation:twinkle var(--d,2.2s) ease-in-out infinite alternate;
  animation-delay:var(--delay,0s);
  opacity:.85;
  filter:blur(.2px);
}
.scene-tall .light{width:1.6%}
@keyframes twinkle{
  0%{opacity:.35;transform:translate(-50%,-50%) scale(.75)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}
}
.fire-glow{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(255,170,60,.55) 0%,
    rgba(255,110,20,.28) 35%,
    rgba(255,80,0,0) 70%);
  mix-blend-mode:screen;
  transform:translate(-50%,-50%);
  animation:flicker 1.1s ease-in-out infinite alternate;
  filter:blur(2px);
}
.fire-glow.main{width:22%;height:28%}
.fire-glow.outer{width:34%;height:40%;opacity:.7;animation-duration:1.6s;animation-delay:.2s}
.room-warmth{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 92.4% 69.9%,
    rgba(255,140,40,.14) 0%,
    rgba(255,100,20,.06) 28%,
    transparent 55%);
  mix-blend-mode:soft-light;
  animation:roomFlicker 2.4s ease-in-out infinite alternate;
  pointer-events:none;
}
.scene-tall .room-warmth{
  background:radial-gradient(ellipse at 89.9% 63.4%,
    rgba(255,140,40,.14) 0%,
    rgba(255,100,20,.06) 28%,
    transparent 55%);
}
@keyframes flicker{
  0%{opacity:.55;transform:translate(-50%,-50%) scale(.96) skewX(-1deg)}
  40%{opacity:.9;transform:translate(-50%,-50%) scale(1.04) skewX(1.5deg)}
  100%{opacity:.7;transform:translate(-50%,-50%) scale(1.01) skewX(-.5deg)}
}
@keyframes roomFlicker{
  0%{opacity:.55}
  100%{opacity:1}
}
.window{
  position:absolute;
  overflow:hidden;
  border-radius:2px;
}
.flake{
  position:absolute;
  top:-4%;
  width:var(--s,3px);height:var(--s,3px);
  border-radius:50%;
  background:rgba(255,255,255,.85);
  box-shadow:0 0 3px rgba(200,220,255,.5);
  animation:fall var(--dur,7s) linear infinite;
  animation-delay:var(--delay,0s);
  opacity:.7;
}
@keyframes fall{
  0%{transform:translate3d(0,-5%,0);opacity:0}
  8%{opacity:.85}
  100%{transform:translate3d(var(--drift,12px),110%,0);opacity:.15}
}
.sound-btn{
  position:fixed;z-index:20;
  right:max(12px, env(safe-area-inset-right));
  bottom:max(12px, env(safe-area-inset-bottom));
  display:inline-flex;align-items:center;gap:.55em;
  padding:.65em 1em .65em .85em;
  border:1px solid rgba(255,220,150,.35);
  border-radius:999px;
  background:rgba(28,14,10,.72);
  color:#ffe9b0;
  font:500 .92rem/1 Georgia,"Times New Roman",serif;
  letter-spacing:.02em;
  cursor:pointer;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 18px rgba(0,0,0,.45);
  transition:background .2s, border-color .2s, transform .15s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.sound-btn:hover{background:rgba(42,22,16,.85);border-color:rgba(255,220,150,.55)}
.sound-btn:active{transform:scale(.97)}
.sound-btn svg{width:1.25em;height:1.25em;flex:0 0 auto;fill:currentColor;opacity:.95}
.sound-btn .label{white-space:nowrap}
.sound-btn.is-on .icon-muted{display:none}
.sound-btn:not(.is-on) .icon-on{display:none}
.sound-btn.is-on .label-tap{display:none}
.sound-btn:not(.is-on) .label-mute,
.sound-btn:not(.is-on) .label-unmute{display:none}
.sound-btn.is-on.is-playing .label-unmute{display:none}
.sound-btn.is-on:not(.is-playing) .label-mute{display:none}
@media (prefers-reduced-motion:reduce){
  .greeting{animation:none;opacity:1}
  .signoff .ch{animation:none;opacity:1;transform:none}
  .sparkle{animation:none;opacity:.55}
  .light{animation-duration:8s!important;animation-name:twinkleSlow}
  .fire-glow,.room-warmth{animation-duration:10s!important}
  .flake{animation-duration:18s!important}
}
@keyframes twinkleSlow{
  0%{opacity:.55;transform:translate(-50%,-50%) scale(.95)}
  100%{opacity:.9;transform:translate(-50%,-50%) scale(1.05)}
}
</style>
</head>
<body>
<div class="stage" role="img" aria-label="Merry Christmas card from the Changs: a cozy oil-painting living room with a Christmas tree, fireplace, sleeping seal point Himalayan kitten and Norwich terrier, and snow outside">

  <!-- Landscape scene -->
  <div class="scene scene-wide">
    <img src="scene-wide.jpg" alt="" width="1280" height="720" decoding="async">
    <div class="layer room-warmth" aria-hidden="true"></div>
    <div class="fire-glow main" style="left:92.4%;top:69.9%" aria-hidden="true"></div>
    <div class="fire-glow outer" style="left:92.4%;top:69.9%" aria-hidden="true"></div>
    <div class="layer" id="lights-wide" aria-hidden="true"></div>
    <div class="window" style="left:6.5%;top:2.5%;width:18.5%;height:52%" aria-hidden="true" id="win-wide"></div>
    <div class="titles">
      <p class="greeting">Merry Christmas</p>
      <p class="signoff" id="signoff-wide" aria-label="from the Changs">
        <span class="sparkle s1" aria-hidden="true"></span>
        <span class="sparkle s2" aria-hidden="true"></span>
        <span class="sparkle s3" aria-hidden="true"></span>
        <span class="sparkle s4" aria-hidden="true"></span>
      </p>
    </div>
  </div>

  <!-- Portrait scene -->
  <div class="scene scene-tall">
    <img src="scene-tall.jpg" alt="" width="720" height="1280" decoding="async">
    <div class="layer room-warmth" aria-hidden="true"></div>
    <div class="fire-glow main" style="left:89.9%;top:63.4%;width:26%;height:20%" aria-hidden="true"></div>
    <div class="fire-glow outer" style="left:89.9%;top:63.4%;width:38%;height:28%" aria-hidden="true"></div>
    <div class="layer" id="lights-tall" aria-hidden="true"></div>
    <div class="window" style="left:3%;top:20%;width:24%;height:32%" aria-hidden="true" id="win-tall"></div>
    <div class="titles">
      <p class="greeting">Merry Christmas</p>
      <p class="signoff" id="signoff-tall" aria-label="from the Changs">
        <span class="sparkle s1" aria-hidden="true"></span>
        <span class="sparkle s2" aria-hidden="true"></span>
        <span class="sparkle s3" aria-hidden="true"></span>
        <span class="sparkle s4" aria-hidden="true"></span>
      </p>
    </div>
  </div>
</div>

<button type="button" class="sound-btn" id="sound-btn" aria-pressed="false" aria-label="Tap for sound">
  <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3.5L12 19.5V4.5L7.5 9H4zm11.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3.5L12 19.5V4.5L7.5 9H4zm11.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
  <span class="label label-tap">Tap for sound</span>
  <span class="label label-mute">Mute</span>
  <span class="label label-unmute">Unmute</span>
</button>

<script>
(function(){
  var wideLights=[
    [57.7,29.2],[63.0,22.1],[53.4,32.1],[57.0,23.6],[58.7,17.2],[65.8,35.7],
    [55.6,35.6],[67.1,41.4],[63.7,31.5],[62.7,13.5],[52.5,43.1],[64.0,19.6],
    [60.4,40.6],[58.4,22.5],[54.3,36.2],[51.6,38.6],[69.1,43.6],[66.9,49.0],
    [62.4,51.1],[57.7,53.3],[55.2,45.6],[51.8,53.2],[61.4,54.4],[53.1,51.1],
    [48.2,56.8],[70.7,57.5],[55.3,59.6],[66.4,61.9],[60.0,62.9],[52.3,66.0]
  ];
  var tallLights=[
    [52.6,19.6],[55.6,23.6],[54.4,26.6],[49.9,27.0],[59.2,29.9],[59.9,31.5],
    [52.4,31.9],[48.5,33.7],[46.1,35.6],[62.1,36.1],[60.8,38.4],[60.3,40.1],
    [47.5,40.7],[40.6,43.6],[59.7,43.8],[64.4,47.7],[36.7,49.6],[46.8,49.2],
    [33.9,50.9],[39.7,51.1],[57.6,52.1],[36.7,55.1],[50.0,56.2],[66.0,57.2],
    [57.5,62.2],[37.1,61.2],[34.9,62.3],[62.5,61.6],[31.4,62.3],[66.5,60.3]
  ];
  function placeLights(id, pts){
    var el=document.getElementById(id);
    if(!el) return;
    var frag=document.createDocumentFragment();
    pts.forEach(function(p,i){
      var d=document.createElement('div');
      d.className='light';
      d.style.left=p[0]+'%';
      d.style.top=p[1]+'%';
      d.style.setProperty('--d',(1.6+((i*0.37)%1.4)).toFixed(2)+'s');
      d.style.setProperty('--delay',((-i*0.23)%2.8).toFixed(2)+'s');
      frag.appendChild(d);
    });
    el.appendChild(frag);
  }
  function snow(id, n){
    var el=document.getElementById(id);
    if(!el) return;
    var frag=document.createDocumentFragment();
    for(var i=0;i<n;i++){
      var f=document.createElement('div');
      f.className='flake';
      f.style.left=(Math.random()*100).toFixed(1)+'%';
      f.style.setProperty('--s',(1.5+Math.random()*3.5).toFixed(1)+'px');
      f.style.setProperty('--dur',(5+Math.random()*7).toFixed(1)+'s');
      f.style.setProperty('--delay',(-Math.random()*10).toFixed(1)+'s');
      f.style.setProperty('--drift',((Math.random()-.5)*28).toFixed(0)+'px');
      frag.appendChild(f);
    }
    el.appendChild(frag);
  }
  function fillSignoff(id){
    var el=document.getElementById(id);
    if(!el) return;
    var text='from the Changs';
    var frag=document.createDocumentFragment();
    for(var i=0;i<text.length;i++){
      var ch=text.charAt(i);
      var s=document.createElement('span');
      if(ch===' '){ s.className='sp'; s.innerHTML='&nbsp;'; }
      else { s.className='ch'; s.style.setProperty('--i', String(i)); s.textContent=ch; }
      frag.appendChild(s);
    }
    var sparkles=[].slice.call(el.querySelectorAll('.sparkle'));
    el.insertBefore(frag, sparkles[0]||null);
  }
  placeLights('lights-wide', wideLights);
  placeLights('lights-tall', tallLights);
  snow('win-wide', 28);
  snow('win-tall', 22);
  fillSignoff('signoff-wide');
  fillSignoff('signoff-tall');

  /* ---- Web Audio: public-domain Silent Night (music box) + fire crackle ---- */
  var btn=document.getElementById('sound-btn');
  var audioCtx=null, masterGain=null, musicGain=null, crackleGain=null;
  var playing=false, started=false, musicTimer=null, crackleTimer=null;

  // Melody: Silent Night (Gruber, 1818) — public domain. MIDI-ish note numbers.
  // Phrase in 6/8 feel, music-box register.
  var melody=[
    // Silent night, holy night
    [67,1],[69,1],[67,2],[64,4],
    [67,1],[69,1],[67,2],[64,4],
    // All is calm, all is bright
    [74,3],[74,1],[71,4],
    [72,3],[72,1],[67,4],
    // Round yon virgin mother and child
    [69,3],[69,1],[72,2],[71,1],[69,1],
    [67,1],[69,1],[67,2],[64,4],
    // Holy infant so tender and mild
    [69,3],[69,1],[72,2],[71,1],[69,1],
    [67,1],[69,1],[67,2],[64,4],
    // Sleep in heavenly peace
    [74,3],[74,1],[77,2],[74,1],[71,1],
    [72,4],[67,4],
    // Sleep in heavenly peace
    [72,2],[67,2],[64,2],[60,2],
    [62,4],[60,4]
  ];
  var beatSec=0.28; // gentle music-box tempo
  var loopGap=1.6;

  function ensureCtx(){
    if(audioCtx) return audioCtx;
    var AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AC();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.55;
    masterGain.connect(audioCtx.destination);
    musicGain=audioCtx.createGain();
    musicGain.gain.value=0.38;
    musicGain.connect(masterGain);
    crackleGain=audioCtx.createGain();
    crackleGain.gain.value=0.12;
    crackleGain.connect(masterGain);
    return audioCtx;
  }

  function midiToFreq(n){ return 440*Math.pow(2,(n-69)/12); }

  function playBell(freq, when, dur){
    var ctx=audioCtx;
    var o1=ctx.createOscillator();
    var o2=ctx.createOscillator();
    var g=ctx.createGain();
    var f=ctx.createBiquadFilter();
    o1.type='sine'; o2.type='triangle';
    o1.frequency.value=freq;
    o2.frequency.value=freq*2.01;
    f.type='lowpass'; f.frequency.value=2400;
    o1.connect(g); o2.connect(g); g.connect(f); f.connect(musicGain);
    var t0=when, t1=when+dur*0.85;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.55, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t1);
    o1.start(t0); o2.start(t0);
    o1.stop(t1+0.05); o2.stop(t1+0.05);
  }

  function scheduleMelody(startTime){
    var t=startTime;
    for(var i=0;i<melody.length;i++){
      var n=melody[i][0], beats=melody[i][1];
      var dur=beats*beatSec;
      playBell(midiToFreq(n), t, Math.max(0.35, dur*0.95));
      t+=dur;
    }
    return t+loopGap;
  }

  function scheduleLoop(){
    if(!playing||!audioCtx) return;
    var start=Math.max(audioCtx.currentTime+0.05, audioCtx.currentTime);
    var end=scheduleMelody(start);
    var delayMs=Math.max(50, (end-audioCtx.currentTime)*1000);
    musicTimer=setTimeout(scheduleLoop, delayMs);
  }

  function crackleBurst(){
    if(!playing||!audioCtx) return;
    var ctx=audioCtx;
    var dur=0.05+Math.random()*0.12;
    var frames=Math.max(1, Math.floor(ctx.sampleRate*dur));
    var buf=ctx.createBuffer(1, frames, ctx.sampleRate);
    var data=buf.getChannelData(0);
    for(var i=0;i<frames;i++){
      var env=Math.pow(1-i/frames, 1.8);
      data[i]=(Math.random()*2-1)*env;
    }
    var src=ctx.createBufferSource();
    src.buffer=buf;
    var bp=ctx.createBiquadFilter();
    bp.type='bandpass';
    bp.frequency.value=800+Math.random()*2200;
    bp.Q.value=0.7+Math.random()*1.2;
    var g=ctx.createGain();
    g.gain.value=0.35+Math.random()*0.45;
    src.connect(bp); bp.connect(g); g.connect(crackleGain);
    src.start();
    var next=80+Math.random()*420;
    crackleTimer=setTimeout(crackleBurst, next);
  }

  function setUi(on, isPlaying){
    btn.classList.toggle('is-on', !!on);
    btn.classList.toggle('is-playing', !!isPlaying);
    btn.setAttribute('aria-pressed', isPlaying?'true':'false');
    if(!on) btn.setAttribute('aria-label','Tap for sound');
    else if(isPlaying) btn.setAttribute('aria-label','Mute sound');
    else btn.setAttribute('aria-label','Unmute sound');
  }

  function startAudio(){
    ensureCtx();
    var p=audioCtx.resume();
    function go(){
      playing=true; started=true;
      setUi(true, true);
      if(musicTimer) clearTimeout(musicTimer);
      if(crackleTimer) clearTimeout(crackleTimer);
      scheduleLoop();
      crackleBurst();
    }
    if(p&&p.then) p.then(go).catch(go); else go();
  }

  function stopAudio(){
    playing=false;
    setUi(started, false);
    if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; }
    if(crackleTimer){ clearTimeout(crackleTimer); crackleTimer=null; }
    if(masterGain&&audioCtx){
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    }
  }

  function resumeAudio(){
    ensureCtx();
    var p=audioCtx.resume();
    function go(){
      if(masterGain){
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0.55, audioCtx.currentTime);
      }
      playing=true;
      setUi(true, true);
      if(musicTimer) clearTimeout(musicTimer);
      if(crackleTimer) clearTimeout(crackleTimer);
      scheduleLoop();
      crackleBurst();
    }
    if(p&&p.then) p.then(go).catch(go); else go();
  }

  if(/[?&]preview=1(?:&|$)/.test(location.search)){btn.style.display='none';}
  btn.addEventListener('click', function(){
    // Create / resume AudioContext inside the user gesture (iOS Safari).
    ensureCtx();
    if(!started){ startAudio(); return; }
    if(playing) stopAudio(); else resumeAudio();
  });
})();
</script>
